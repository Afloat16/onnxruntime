name: Validate CPU entropy calibration
on:
  push:
    branches: [validation/cpu-entropy-reconstruction-20261112]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ea94334d49d7cf39e7f3f953b0c054c3205b086
          fetch-depth: 2
          persist-credentials: false
      - id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Create isolated build environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ort-validation-venv"
          echo "$RUNNER_TEMP/ort-validation-venv/bin" >> "$GITHUB_PATH"
      - name: Install CPU build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/ci_build/requirements/pybind/requirements.txt
          python -m pip install cmake==3.31.6 ninja numpy==2.3.5 onnx==1.20.1 ml_dtypes pytest==9.1.1 ruff==0.12.12
      - name: Restore native CPU build cache
        id: cpp_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/CPU
          key: ort-cpu-release-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-cmake3.31.6-a8246c0d
      - name: Build native CPU runtime and Python wheel from source
        shell: bash
        run: |
          set -o pipefail
          rm -f build/CPU/Release/dist/*.whl
          python tools/ci_build/build.py --config Release --build_dir build/CPU --update --build --parallel 2 --build_wheel --skip_tests --cmake_generator Ninja --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_BUILD_BENCHMARKS=OFF 2>&1 | tee ort-source-build.log
      - name: Save completed native CPU build cache
        if: steps.cpp_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/CPU
          key: ort-cpu-release-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-cmake3.31.6-a8246c0d
      - name: Install only the freshly built wheel
        run: |
          python -m pip install --no-deps --force-reinstall build/CPU/Release/dist/*.whl
          python - <<'PY'
          import hashlib
          import json
          import platform
          import subprocess
          from pathlib import Path
          import numpy
          import onnx
          import onnxruntime
          from onnxruntime.quantization import calibrate
          expected = Path("onnxruntime/python/tools/quantization/calibrate.py").read_bytes()
          actual = Path(calibrate.__file__).read_bytes()
          assert actual == expected, calibrate.__file__
          assert "CPUExecutionProvider" in onnxruntime.get_available_providers()
          metadata = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "numpy": numpy.__version__,
              "onnx": onnx.__version__,
              "onnxruntime": onnxruntime.__version__,
              "runtime_path": onnxruntime.__file__,
              "calibration_path": calibrate.__file__,
              "calibration_sha256": hashlib.sha256(actual).hexdigest(),
              "providers": onnxruntime.get_available_providers(),
          }
          Path("ort-source-build-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY
      - name: Test patched entropy and existing calibration cases
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --import-mode=importlib --junitxml=ort-patched.xml onnxruntime/test/python/quantization/test_entropy_reconstruction.py onnxruntime/test/python/quantization/test_calibration.py 2>&1 | tee ort-patched.log
      - name: Load exact original Python implementation into the same native runtime
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from onnxruntime.quantization import calibrate
          baseline = subprocess.check_output(["git", "show", "a8246c0d094f1ab0d6bf236228e5e67683321cd7:onnxruntime/python/tools/quantization/calibrate.py"])
          target = Path(calibrate.__file__)
          target.write_bytes(baseline)
          assert target.read_bytes() == baseline
          for cached in target.parent.glob("__pycache__/calibrate.*.pyc"):
              cached.unlink()
          print("Original calibration source restored:", target)
          PY
      - name: Confirm unchanged implementation fails the regression cases
        shell: bash
        run: |
          set +e
          python -m pytest -q --import-mode=importlib --junitxml=ort-baseline.xml onnxruntime/test/python/quantization/test_entropy_reconstruction.py > ort-baseline.log 2>&1
          result=$?
          set -e
          cat ort-baseline.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("ort-baseline.xml").getroot()
          assert not root.findall(".//error"), "Baseline must fail assertions, not collection/import."
          failed = {case.attrib["name"] for case in root.findall(".//testcase") if case.find("failure") is not None}
          required = {
              "test_fractional_bucket_averages",
              "test_sparse_histogram_support",
              "test_nondivisible_candidate_widths",
              "test_six_quantized_bins",
              "test_native_cpu_calibration_ranges",
              "test_cached_ranges_drive_static_quantization",
          }
          assert required <= failed, (required - failed, failed)
          print("Confirmed original implementation failures:", sorted(failed))
          PY
      - name: Restore patch and check formatting
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from onnxruntime.quantization import calibrate
          source = Path("onnxruntime/python/tools/quantization/calibrate.py").read_bytes()
          Path(calibrate.__file__).write_bytes(source)
          PY
          python -m ruff check onnxruntime/python/tools/quantization/calibrate.py onnxruntime/test/python/quantization/test_entropy_reconstruction.py
          python -m ruff format --check onnxruntime/python/tools/quantization/calibrate.py onnxruntime/test/python/quantization/test_entropy_reconstruction.py
          git diff --check
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpu-entropy-calibration-evidence
          path: |
            ort-source-build.log
            ort-source-build-metadata.json
            ort-patched.log
            ort-patched.xml
            ort-baseline.log
            ort-baseline.xml
            build/CPU/Release/CMakeCache.txt
      - name: Save tested native CPU wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpu-entropy-native-wheel-a8246c0d
          path: build/CPU/Release/dist/*.whl
